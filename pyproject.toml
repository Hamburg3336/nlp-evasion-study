[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["results", "provenance"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"experiment/src/*.py" = ["E402"]
"experiment/run_all.py" = ["E402"]
"experiment/tests/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"scripts/plot_supplement.py" = ["E402"]
